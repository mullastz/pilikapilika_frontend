<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pilikapilika</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find agents for China to Tanzania cargo and shipping. Compare logistics services, discuss your shipment, and manage bookings with Pilikapilika.">
  <!-- Fallback social preview. Public prerendered pages supply their own details. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pilikapilika">
  <meta property="og:title" content="Pilikapilika | Find Logistics Agents">
  <meta property="og:description" content="Find logistics agents for China to Tanzania cargo. Follow your agency and book shipments directly on Pilikapilika.">
  <meta property="og:image" content="https://pilikapilika.com/assets/landingpage_images/logistics.webp">
  <meta property="og:image:secure_url" content="https://pilikapilika.com/assets/landingpage_images/logistics.webp">
  <meta property="og:image:alt" content="Shipping and logistics with Pilikapilika">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pilikapilika | Find Logistics Agents">
  <meta name="twitter:description" content="Find logistics agents for China to Tanzania cargo. Follow your agency and book shipments directly on Pilikapilika.">
  <meta name="twitter:image" content="https://pilikapilika.com/assets/landingpage_images/logistics.webp">
  <meta name="twitter:image:alt" content="Shipping and logistics with Pilikapilika">
  <!-- Public pages replace this during prerendering. The app shell stays out of search. -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ff7800">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      const media = window.matchMedia('(prefers-color-scheme: dark)');

      media.addEventListener('change', (e) => {
          const saved = localStorage.getItem('theme');

          // Only auto-switch if user hasn't manually chosen
          if (!saved) {
            const html = document.documentElement;

            if (e.matches) {
              html.classList.add('dark');
            } else {
              html.classList.remove('dark');
            }
          }
        });
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
