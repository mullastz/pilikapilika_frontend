<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pilikapilika</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find agents for China to Tanzania cargo and shipping. Compare logistics services, discuss your shipment, and manage bookings with Pilikapilika.">
  <!-- Public pages replace this during prerendering. The app shell stays out of search. -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ff7800">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      const media = window.matchMedia('(prefers-color-scheme: dark)');

      media.addEventListener('change', (e) => {
          const saved = localStorage.getItem('theme');

          // Only auto-switch if user hasn't manually chosen
          if (!saved) {
            const html = document.documentElement;

            if (e.matches) {
              html.classList.add('dark');
            } else {
              html.classList.remove('dark');
            }
          }
        });
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
